<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign Up | HydroPure Water Purifier Sales & Service</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Create a HydroPure Customer Portal account to manage your AMC plans, track filter replacements, and view past service history.">
  <meta name="keywords" content="HydroPure, Customer Sign Up, AMC Tracker, Filter Replacement, Service History">
  <meta name="author" content="HydroPure Service Team">

  <!-- Favicon Mock -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M 5 10 C 7 8, 9 12, 12 10 C 15 8, 17 12, 19 10'/><path d='M 5 14 C 7 12, 9 16, 12 14 C 15 12, 17 16, 19 14'/></svg>">

  <!-- CDNs: Bootstrap 5, Lucide Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Stylesheets -->
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/dark-mode.css" rel="stylesheet">
  <link href="assets/css/rtl.css" rel="stylesheet">
</head>

<body class="home-white-text">

  <!-- Custom Page Loading Spinner -->
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <div class="loader-waves">
      <div class="loader-wave-element"></div>
      <div class="loader-wave-element"></div>
      <div class="loader-wave-element"></div>
    </div>
    <h2 class="fs-6 mt-3 tracking-widest text-uppercase text-muted">HydroPure</h2>
  </div>

  <!-- Sign Up Section -->
  <main class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
          <!-- Floating Top Controls for Theme & RTL -->
          <div class="auth-controls-container d-flex gap-2">
            <button id="dir-toggle" class="toggle-btn" aria-label="Toggle language direction">RTL</button>
            <button id="theme-toggle" class="toggle-btn" aria-label="Toggle dark mode">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
          </div>

          <div class="border bg-white p-5 shadow-lg text-start rounded-3 position-relative overflow-hidden auth-card mt-3 mt-sm-0">

            <div class="text-center mb-4">
              <a href="index.html"
                class="d-inline-flex align-items-center justify-content-center text-decoration-none mb-4"
                style="font-size: 1.25rem;">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                  style="fill: none; stroke: var(--accent-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; width: 32px; height: 32px; margin-right: 8px;">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M 5 10 C 7 8, 9 12, 12 10 C 15 8, 17 12, 19 10" />
                  <path d="M 5 14 C 7 12, 9 16, 12 14 C 15 12, 17 16, 19 14" />
                </svg>
                <span class="fw-bold" style="color: var(--accent-color);">HydroPure</span>
              </a>
              <h1 class="h5 fw-bold text-primary mb-2">Create Account</h1>
              <p class="text-secondary small">Join HydroPure to manage your services</p>
            </div>

            <form class="premium-form" id="signupForm" onsubmit="handleSignup(event)">
              <div class="form-group mb-3">
                <label for="signup-name">Full Name&nbsp;*</label>
                <input type="text" id="signup-name" class="form-control" required placeholder="John Doe">
              </div>

              <div class="form-group mb-3">
                <label for="signup-email">Email Address&nbsp;*</label>
                <input type="email" id="signup-email" class="form-control" required placeholder="customer@domain.com">
              </div>

              <div class="form-group mb-3">
                <label for="signup-password">Password&nbsp;*</label>
                <div class="input-group">
                  <input type="password" id="signup-password" class="form-control border-end-0" required
                    placeholder="••••••••">
                  <span class="input-group-text bg-white cursor-pointer"
                    onclick="togglePassword('signup-password', this)" style="cursor: pointer;">
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-off-icon d-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                      <line x1="2" x2="22" y1="2" y2="22" />
                    </svg>
                  </span>
                </div>
              </div>

              <div class="form-group mb-4">
                <label for="signup-confirm-password">Confirm Password&nbsp;*</label>
                <div class="input-group">
                  <input type="password" id="signup-confirm-password" class="form-control border-end-0" required
                    placeholder="••••••••">
                  <span class="input-group-text bg-white cursor-pointer"
                    onclick="togglePassword('signup-confirm-password', this)" style="cursor: pointer;">
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-off-icon d-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                      <line x1="2" x2="22" y1="2" y2="22" />
                    </svg>
                  </span>
                </div>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                  <label class="form-check-label" for="flexCheckDefault">
                    I agree to the <a href="terms-of-service.html">Terms of Service</a> and <a
                      href="privacy-policy.html">Privacy Policy</a>
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-premium w-100 py-3 mb-3">Sign Up</button>

              <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 opacity-25">
                <span class="mx-2 text-secondary small">or</span>
                <hr class="flex-grow-1 opacity-25">
              </div>

              <div class="d-flex flex-column gap-2 mb-4">
                <button type="button"
                  class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512" width="18" height="18">
                    <path fill="currentColor"
                      d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z" />
                  </svg>
                  Continue with Google
                </button>
                <button type="button"
                  class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="18" height="18">
                    <path fill="currentColor"
                      d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                  </svg>
                  Continue with Apple
                </button>
              </div>

            </form>

            <div class="text-center mt-3 pt-3 border-top border-light">
              <p class="small text-secondary mb-0">Already have an account? <a href="login.html"
                  class="text-info text-decoration-none fw-bold">Login here</a></p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>



  <!-- JS CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/main.js"></script>

  <script>
    function togglePassword(inputId, iconContainer) {
      const input = document.getElementById(inputId);
      const eyeIcon = iconContainer.querySelector('.eye-icon');
      const eyeOffIcon = iconContainer.querySelector('.eye-off-icon');

      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.classList.add('d-none');
        eyeOffIcon.classList.remove('d-none');
      } else {
        input.type = 'password';
        eyeIcon.classList.remove('d-none');
        eyeOffIcon.classList.add('d-none');
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      // Simulate dashboard loading
      window.location.href = 'dashboard.html';
    }
  </script>
</body>

</html>
